name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install pandoc 3.6.4
        run: |
          curl -fsSL https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-1-amd64.deb -o /tmp/pandoc.deb
          sudo dpkg -i /tmp/pandoc.deb
          rm -f /tmp/pandoc.deb
          pandoc --version
      - name: Sync dependencies
        run: uv sync --dev
      - name: Lint new & core checks
        run: uv run ruff check src/daf --select E9,F63,F7,F82
      - name: Run pytest
        run: uv run pytest -v
