name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Sync dependencies
        run: uv sync --dev
      - name: Lint new & core checks
        run: uv run ruff check src/daf --select E9,F63,F7,F82
      - name: Run pytest
        run: uv run pytest -v
